<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>TASK-02</title>
</head>
<body>

  <table id="studentsTable" class="table table-bordered" style="text-align: center; margin-top: 100px;">
        <thead> <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
            </tr> </thead>

        <tbody></tbody>
    </table>
  <!-- ======================== -->
  <script>

        let list = [
        {names: "Ibrahim", age: 33, grade: "A"},
        {names: "Ali", age: 24, grade: "B"},
        {names: "Saad", age: 19, grade: "A+"},
        ]
        list.forEach(lists =>{
          const table_B = document.querySelector("#studentsTable tbody");
            const row = document.createElement("tr")

              row.innerHTML = 
              `
              <td>${lists.names}</td>
              <td>${lists.age}</td>
              <td>${lists.grade}</td>
              `
              table_B.appendChild(row)
        })

  </script>
    <!-- ======================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
