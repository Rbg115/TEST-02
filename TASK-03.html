<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>TASK-03</title>
</head>
<body>
  
  <table id="userTable" class="table table-bordered" style="text-align: center; margin-top: 100px;">
        <thead> <tr>
                <th>Name</th>
                <th>Email</th>
            </tr> </thead>

        <tbody></tbody>
    </table>
  <!-- ======================== -->
  <script>
        let users = [
        { name: "Ibrahim", email: "ibrahim@email.com" },
        { name: "Ali", email: "ali@email.com" },
        ];

        users.forEach(user =>{
            const table_B = document.querySelector("#userTable tbody");
            const row = document.createElement("tr")

          row.innerHTML = 
          `
          <td>${user.name}</td>
          <td>${user.email}</td>
          `
          table_B.appendChild(row)
        })

  </script>
    <!-- ======================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
