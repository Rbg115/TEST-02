<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>TASK-04</title>
</head>
<body>
    <!-- ================================= -->
  <ul class="nav nav-tabs" 
      style="background-color: #333; color: white; padding-top: 20px; display: flex; justify-content: center;" >
    <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Home</a> </li>
    <li class="nav-item"> <a class="nav-link" href="#" style="color: white;">Sections</a> </li>
    <li class="nav-item"> <a class="nav-link" href="#" style="color: white;">Services</a> </li>
    <li class="nav-item"> <a class="nav-link" href="#" style="color: white;">Contact us</a> </li>
    <li class="nav-item"> <a class="nav-link" href="#" style="color: white;">Help</a> </li>
  </ul>
    <!-- ================================= -->
     <section id="sec-1">
        <div>
            <h2 class="text-center" style="position: relative; top: 60px;">Welcome to Ibrahim Store</h2>
        </div>
     </section>
    <!-- ================================= -->
     <section class="container py-5" style="margin-top: 70px;">
        <div id="div-1" class="row g-4"></div>
     </section>
    <!-- ================================= -->
     <script>

    async function one() {
    const api = await fetch("https://fakestoreapi.com/products");
    const data = await api.json();

    const div = document.getElementById("div-1");
      div.innerHTML = "";

      data.forEach(product => {
      div.innerHTML += `

        <div class="col-md-3"">
            <div class="card h-100 text-center" style="border: solid black 1px;" >
            <img src="${product.image}" class="card-img-top p-3" style="height:200px; object-fit:contain;">
                <div class="card-body">
                    <p class="card-text btn btn-success">السعر: ${product.price} $</p> <br>
                    <span class="card-title">${product.title}</span> <br>
                </div>
            </div>
        </div>
        `; 
    });
}
one();
    <!-- ================================= -->
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
